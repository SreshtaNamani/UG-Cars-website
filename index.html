<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>UG Cars | Pre-owned cars</title>
    </head>
    <body>
        <!--Navigation-->
        <header>
            <nav>
                <h1>UG Cars</h1>
                <ul>
                    <li><a href="#">Inventory</a></li>
                    <li><a href="#">Sell Car</a></li>
                    <li><a href="#">Finance</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>
        <!--Inventory Section-->
        <main>
            <section class="inventory">
                <h2>Available Cars</h2>
                <div class="filter-bar">
                    <input type="text" placeholder="Search by brand or model">
                    <select>
                        <option>All Brands</option>
                        <option>Hyundai</option>
                        <option>Tata</option>
                        <option>Maruti Suzuki</option>
                        <option>Honda</option>
                    </select>
                    <select>
                        <option>Fuel Type</option>
                        <option>Petrol</option>
                        <option>Diesel</option>
                        <option>CNG</option>
                        <option>Electric</option>
                    </select>
                    <button>Search</button>
                </div>
                <div class="car-container">
                    <div class="car-card">
                        <img src="images/Creta.jpeg.avif" alt="Hyundai Creta">
                        <h3>Hyundai Creta</h3>
                        <p>2022 | Petrol | Automatic</p>
                        <p>₹12,50,000</p>
                        <button>View Details</button>
                    </div>
                    <div class="car-card">
                        <img src="images/Nexon.jpeg" alt="Tata Nexon">
                        <h3>Tata Nexon</h3>
                        <p>2021 | Diesel | Manual</p>
                        <p>₹9,00,000</p>
                        <button>View Details</button>
                    </div>
                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
