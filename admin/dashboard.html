<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | UG Cars Admin</title><link rel="stylesheet" href="../assets/css/style.css">
<script>if(!sessionStorage.getItem('ug_admin_session'))location.replace('index.html')</script></head><body>
<div class="adm"><aside class="side"><img src="../assets/images/logo.png" alt="UG Cars"><a class="on" href="dashboard.html"><i class="fa-solid fa-car"></i> Inventory</a><a href="../index.html" target="_blank"><i class="fa-solid fa-globe"></i> View Website</a><a href="#" id="rs"><i class="fa-solid fa-rotate-left"></i> Reset Demo Data</a><a href="#" id="lo"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a></aside>
<main class="am"><div class="ah"><div><h1>Inventory Dashboard</h1><p>Add, edit and remove cars. Changes appear on the website instantly.</p></div><button class="btn blue" id="add"><i class="fa-solid fa-plus"></i> Add New Car</button></div>
<div class="sc"><div><small>Total Cars</small><b id="a1">0</b></div><div><small>Available</small><b id="a2">0</b></div><div><small>Sold</small><b id="a3">0</b></div><div><small>Stock Value</small><b id="a4">0</b></div></div>
<div class="tools"><div class="field"><input id="s" type="search" placeholder="Search inventory…"></div><div class="field" style="max-width:190px"><select id="sf"><option value="">All statuses</option><option>Available</option><option>Reserved</option><option>Sold</option></select></div></div>
<div class="tw"><table><thead><tr><th>Vehicle</th><th>Price</th><th>Year</th><th>Fuel</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div></main></div>
<div class="modal" id="m"><form class="sheet" id="f"><h2 id="mt">Add New Car</h2><p>Fill in the vehicle details below.</p><div class="fgrid">
<div class="field"><label>Brand *</label><input name="brand" list="bl" required placeholder="e.g. Hyundai"><datalist id="bl"><option>Hyundai<option>Tata<option>Honda<option>Maruti Suzuki<option>Toyota<option>Kia<option>Mahindra</datalist></div>
<div class="field"><label>Model / Variant *</label><input name="model" required placeholder="e.g. Creta SX"></div>
<div class="field"><label>Year *</label><input name="year" type="number" min="2000" max="2030" required></div>
<div class="field"><label>Price (₹) *</label><input name="price" type="number" min="0" step="1000" required></div>
<div class="field"><label>Fuel *</label><select name="fuel"><option>Petrol<option>Diesel<option>CNG<option>Electric<option>Hybrid</select></div>
<div class="field"><label>Transmission *</label><select name="trans"><option>Manual<option>Automatic</select></div>
<div class="field"><label>Kilometres driven *</label><input name="km" type="number" min="0" required></div>
<div class="field"><label>Ownership</label><select name="owners"><option>1st Owner<option>2nd Owner<option>3rd Owner<option>4+ Owners</select></div>
<div class="field"><label>City</label><input name="city" value="Hyderabad"></div>
<div class="field"><label>Status</label><select name="status"><option>Available<option>Reserved<option>Sold</select></div>
<div class="field full"><label>Features (comma separated)</label><input name="features" placeholder="ABS, Airbags, Sunroof, Reverse Camera"></div>
<div class="field full"><label>Description</label><textarea name="desc" rows="3"></textarea></div>
<div class="field full"><label>Photos (first photo is the cover)</label><div class="drop" id="dz"><i class="fa-solid fa-cloud-arrow-up"></i> Click to upload photos</div><input type="file" id="fi" accept="image/*" multiple hidden><div class="prev" id="pv"></div></div></div>
<div class="acts"><button type="button" class="btn line" id="x">Cancel</button><button class="btn blue" id="sv">Save Car</button></div></form></div>
<script src="../assets/js/app.js"></script><script src="../assets/js/admin.js"></script></body></html>
