<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Car | UG Cars</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-page">

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <aside class="admin-sidebar">

            <div class="admin-logo">
                <img src="../image.png" alt="UG Cars">
            </div>

            <nav class="admin-nav">

                <a href="admin.html">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>

                <a href="inventory.html" class="active">
                    <i class="fa-solid fa-car"></i>
                    <span>Inventory</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    <span>Finance Enquiries</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-envelope"></i>
                    <span>Contact Enquiries</span>
                </a>

            </nav>

            <div class="admin-sidebar-bottom">

                <a href="../index.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Website</span>
                </a>

            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="admin-content">

            <div class="admin-topbar">

                <div>
                    <p class="admin-welcome">Manage your dealership</p>
                    <h1>Add New Car</h1>
                </div>

                <div class="admin-user">

                    <div class="admin-user-icon">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div>
                        <strong>Admin</strong>
                        <span>UG Cars</span>
                    </div>

                </div>

            </div>


            <!-- ADD CAR FORM -->
            <section class="admin-section">

                <div class="admin-section-header">

                    <div>
                        <h2>Vehicle Details</h2>
                        <p>Enter the details of the vehicle you want to add.</p>
                    </div>

                </div>


                <form class="admin-car-form">

                    <div class="admin-form-grid">

                        <div class="admin-form-group">
                            <label for="carName">Car Name</label>
                            <input
                                type="text"
                                id="carName"
                                placeholder="e.g. Hyundai Creta"
                                required>
                        </div>


                        <div class="admin-form-group">
                            <label for="brand">Brand</label>
                            <select id="brand" required>
                                <option value="">Select brand</option>
                                <option value="tata">Tata</option>
                                <option value="hyundai">Hyundai</option>
                                <option value="maruti">Maruti Suzuki</option>
                                <option value="mahindra">Mahindra</option>
                                <option value="toyota">Toyota</option>
                                <option value="honda">Honda</option>
                                <option value="kia">Kia</option>
                                <option value="mg">MG</option>
                                <option value="volkswagen">Volkswagen</option>
                                <option value="skoda">Skoda</option>
                            </select>
                        </div>


                        <div class="admin-form-group">
                            <label for="year">Year</label>
                            <input
                                type="number"
                                id="year"
                                placeholder="e.g. 2023"
                                min="1990"
                                max="2030"
                                required>
                        </div>


                        <div class="admin-form-group">
                            <label for="price">Price</label>
                            <input
                                type="text"
                                id="price"
                                placeholder="e.g. ₹12.50 Lakh"
                                required>
                        </div>


                        <div class="admin-form-group">
                            <label for="fuel">Fuel Type</label>
                            <select id="fuel" required>
                                <option value="">Select fuel type</option>
                                <option value="petrol">Petrol</option>
                                <option value="diesel">Diesel</option>
                                <option value="cng">CNG</option>
                                <option value="electric">Electric</option>
                                <option value="hybrid">Hybrid</option>
                            </select>
                        </div>


                        <div class="admin-form-group">
                            <label for="transmission">Transmission</label>
                            <select id="transmission" required>
                                <option value="">Select transmission</option>
                                <option value="manual">Manual</option>
                                <option value="automatic">Automatic</option>
                            </select>
                        </div>


                        <div class="admin-form-group">
                            <label for="kilometers">Kilometers</label>
                            <input
                                type="number"
                                id="kilometers"
                                placeholder="e.g. 25000"
                                min="0"
                                required>
                        </div>


                        <div class="admin-form-group">
                            <label for="status">Status</label>
                            <select id="status" required>
                                <option value="">Select status</option>
                                <option value="available">Available</option>
                                <option value="sold">Sold</option>
                            </select>
                        </div>

                    </div>


                    <div class="admin-form-group full-width">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            rows="5"
                            placeholder="Enter a short description of the vehicle..."></textarea>
                    </div>


                    <div class="admin-form-group full-width">
                        <label for="carImage">Car Image</label>
                        <input
                            type="file"
                            id="carImage"
                            accept="image/*">
                    </div>


                    <div class="admin-form-buttons">

                        <a href="inventory.html" class="admin-cancel-btn">
                            Cancel
                        </a>

                        <button type="submit" class="admin-submit-btn">
                            <i class="fa-solid fa-plus"></i>
                            Add Car
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</body>
</html>
