<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Car | UG Cars</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-page">

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <aside class="admin-sidebar">

            <div class="admin-logo">
                <img src="../image.png" alt="UG Cars">
            </div>

            <nav class="admin-nav">

                <a href="admin.html">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>

                <a href="inventory.html" class="active">
                    <i class="fa-solid fa-car"></i>
                    <span>Inventory</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    <span>Finance Enquiries</span>
                </a>

                <a href="#">
                    <i class="fa-solid fa-envelope"></i>
                    <span>Contact Enquiries</span>
                </a>

            </nav>

            <div class="admin-sidebar-bottom">

                <a href="../index.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Website</span>
                </a>

            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="admin-content">

            <!-- TOP BAR -->
            <div class="admin-topbar">

                <div>
                    <p class="admin-welcome">Manage your dealership</p>
                    <h1>Add New Car</h1>
                </div>

                <div class="admin-user">

                    <div class="admin-user-icon">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div>
                        <strong>Admin</strong>
                        <span>UG Cars</span>
                    </div>

                </div>

            </div>


            <!-- ADD CAR SECTION -->
            <section class="admin-section">

                <div class="admin-section-header">

                    <div>
                        <h2>Vehicle Details</h2>
                        <p>
                            Add the information below to list a new vehicle
                            in your inventory.
                        </p>
                    </div>

                </div>


                <!-- ADD CAR FORM -->
                <form
                    class="admin-car-form"
                    id="admin-car-form"
                >

                    <!-- TWO COLUMN FORM -->
                    <div class="admin-form-grid">

                        <!-- CAR NAME -->
                        <div class="admin-form-group">

                            <label for="car-name">
                                Car Name
                            </label>

                            <input
                                type="text"
                                id="car-name"
                                placeholder="e.g. Hyundai Creta SX"
                                required>

                        </div>


                        <!-- BRAND -->
                        <div class="admin-form-group">

                            <label for="car-brand">
                                Brand
                            </label>

                            <select id="car-brand" required>

                                <option value="">
                                    Select brand
                                </option>

                                <option value="tata">
                                    Tata
                                </option>

                                <option value="hyundai">
                                    Hyundai
                                </option>

                                <option value="maruti">
                                    Maruti Suzuki
                                </option>

                                <option value="mahindra">
                                    Mahindra
                                </option>

                                <option value="toyota">
                                    Toyota
                                </option>

                                <option value="honda">
                                    Honda
                                </option>

                                <option value="kia">
                                    Kia
                                </option>

                                <option value="mg">
                                    MG
                                </option>

                                <option value="volkswagen">
                                    Volkswagen
                                </option>

                                <option value="skoda">
                                    Skoda
                                </option>

                            </select>

                        </div>


                        <!-- YEAR -->
                        <div class="admin-form-group">

                            <label for="car-year">
                                Year
                            </label>

                            <input
                                type="number"
                                id="car-year"
                                placeholder="e.g. 2023"
                                min="1990"
                                max="2030"
                                required>

                        </div>


                        <!-- PRICE -->
                        <div class="admin-form-group">

                            <label for="car-price">
                                Price
                            </label>

                            <input
                                type="text"
                                id="car-price"
                                placeholder="e.g. ₹12.50 Lakh"
                                required>

                        </div>


                        <!-- FUEL -->
                        <div class="admin-form-group">

                            <label for="car-fuel">
                                Fuel Type
                            </label>

                            <select id="car-fuel" required>

                                <option value="">
                                    Select fuel type
                                </option>

                                <option value="petrol">
                                    Petrol
                                </option>

                                <option value="diesel">
                                    Diesel
                                </option>

                                <option value="cng">
                                    CNG
                                </option>

                                <option value="electric">
                                    Electric
                                </option>

                                <option value="hybrid">
                                    Hybrid
                                </option>

                            </select>

                        </div>


                        <!-- TRANSMISSION -->
                        <div class="admin-form-group">

                            <label for="car-transmission">
                                Transmission
                            </label>

                            <select
                                id="car-transmission"
                                required
                            >

                                <option value="">
                                    Select transmission
                                </option>

                                <option value="manual">
                                    Manual
                                </option>

                                <option value="automatic">
                                    Automatic
                                </option>

                            </select>

                        </div>


                        <!-- KILOMETERS -->
                        <div class="admin-form-group">

                            <label for="car-kilometers">
                                Kilometers
                            </label>

                            <input
                                type="number"
                                id="car-kilometers"
                                placeholder="e.g. 25000"
                                min="0"
                                required>

                        </div>


                        <!-- STATUS -->
                        <div class="admin-form-group">

                            <label for="car-status">
                                Status
                            </label>

                            <select id="car-status" required>

                                <option value="">
                                    Select status
                                </option>

                                <option value="available">
                                    Available
                                </option>

                                <option value="sold">
                                    Sold
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- DESCRIPTION -->
                    <div class="admin-form-group full-width">

                        <label for="car-description">
                            Description
                        </label>

                        <textarea
                            id="car-description"
                            rows="5"
                            placeholder="Enter a short description of the vehicle..."
                        ></textarea>

                    </div>


                    <!-- IMAGE -->
                    <div class="admin-form-group full-width">

                        <label for="carImage">
                            Car Image
                        </label>

                        <input
                            type="file"
                            id="carImage"
                            accept="image/*">

                    </div>


                    <!-- BUTTONS -->
                    <div class="admin-form-buttons">

                        <a
                            href="inventory.html"
                            class="admin-cancel-btn"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="admin-submit-btn"
                        >
                            <i class="fa-solid fa-plus"></i>
                            Add Car
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>


    <!-- ADMIN JAVASCRIPT -->
    <script src="admin.js"></script>

</body>
</html>
